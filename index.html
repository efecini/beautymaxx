<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BeautyMaxx — Coming Soon</title>
    <meta name="description" content="BeautyMaxx is on its way. A refined new standard in beauty, coming soon." />
    <meta name="theme-color" content="#14110e" />
    <meta property="og:title" content="BeautyMaxx — Coming Soon" />
    <meta property="og:description" content="A refined new standard in beauty, coming soon." />
    <meta property="og:image" content="https://beautymaxx.app/assets/hero.jpg" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%14110e'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='28' fill='%23e8d5b5'%3EB%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #14110e;
        --bg-deep: #0c0a08;
        --ink: #f4ece1;
        --muted: #d4c6b4;
        --gold: #e8d5b5;
        --gold-deep: #e0c49a;
        --line: rgba(232, 213, 181, 0.28);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        font-family: Outfit, system-ui, sans-serif;
        background: var(--bg-deep);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .atmosphere {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: var(--bg-deep) url("assets/hero.jpg") 52% 36% / cover no-repeat;
      }

      .atmosphere::before,
      .atmosphere::after {
        content: "";
        position: absolute;
        inset: 0;
      }

      .atmosphere::before {
        background: linear-gradient(
          180deg,
          rgba(12, 10, 8, 0.78) 0%,
          rgba(12, 10, 8, 0.5) 14%,
          rgba(12, 10, 8, 0.1) 34%,
          rgba(12, 10, 8, 0.04) 52%,
          rgba(12, 10, 8, 0.16) 72%,
          rgba(12, 10, 8, 0.72) 100%
        );
      }

      .atmosphere::after {
        display: none;
      }

      .frame {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 1.75rem clamp(1.25rem, 4vw, 3rem);
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .wordmark {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.15rem;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
        text-shadow: 0 2px 18px rgba(12, 10, 8, 0.7);
      }

      .meta {
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 400;
        white-space: nowrap;
        text-shadow: 0 2px 14px rgba(12, 10, 8, 0.8);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        padding: 1.15rem 0 0.5rem;
        min-height: 0;
      }

      .intro,
      .cta {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .intro {
        max-width: 38rem;
      }

      .cta {
        max-width: 32rem;
      }

      .eyebrow {
        font-size: 0.72rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--gold-deep);
        margin-bottom: 0.85rem;
        text-shadow: 0 2px 16px rgba(12, 10, 8, 0.8);
      }

      h1 {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-weight: 500;
        font-size: clamp(2.6rem, 6vw, 4.8rem);
        line-height: 0.92;
        letter-spacing: -0.02em;
        max-width: 12ch;
        color: var(--ink);
        text-shadow: 0 8px 36px rgba(12, 10, 8, 0.55);
      }

      h1 em {
        font-style: italic;
        font-weight: 400;
        color: var(--gold);
      }

      .rule {
        width: 3.5rem;
        height: 1px;
        background: var(--gold-deep);
        margin: 1.25rem auto 1.1rem;
        opacity: 0.85;
      }

      .lede {
        max-width: 32rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        font-weight: 300;
        line-height: 1.7;
        text-shadow: 0 2px 18px rgba(12, 10, 8, 0.75);
      }

      .status {
        margin-top: 1.35rem;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.7rem 1.15rem 0.7rem 1rem;
        color: var(--gold);
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        background: rgba(12, 10, 8, 0.55);
        backdrop-filter: blur(10px);
      }

      .dot {
        width: 0.45rem;
        height: 0.45rem;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 0 0 rgba(232, 213, 181, 0.6);
        animation: pulse 2.4s ease-out infinite;
      }

      footer {
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        gap: 1rem;
        flex-wrap: wrap;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(232, 213, 181, 0.55);
        }
        70% {
          box-shadow: 0 0 0 0.55rem rgba(232, 213, 181, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(232, 213, 181, 0);
        }
      }

      @media (min-width: 801px) {
        .atmosphere {
          background-position: 62% 54%;
        }
      }

      @media (max-width: 800px) {
        .atmosphere {
          background-size: cover;
          background-position: 52% 32%;
        }

        .atmosphere::before {
          background: linear-gradient(
            180deg,
            rgba(12, 10, 8, 0.8) 0%,
            rgba(12, 10, 8, 0.52) 16%,
            rgba(12, 10, 8, 0.12) 40%,
            rgba(12, 10, 8, 0.08) 55%,
            rgba(12, 10, 8, 0.55) 82%,
            rgba(12, 10, 8, 0.82) 100%
          );
        }

        .intro,
        .cta {
          max-width: none;
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="atmosphere" role="img" aria-label="Beauty editorial portrait with smoky eye makeup"></div>
    <div class="frame">
      <header>
        <div class="wordmark">BeautyMaxx</div>
        <div class="meta">Est. 2026</div>
      </header>
      <main>
        <div class="intro">
          <p class="eyebrow">A new standard</p>
          <h1>Beauty, taken <em>further.</em></h1>
        </div>
        <div class="cta">
          <div class="rule" aria-hidden="true"></div>
          <p class="lede">Something refined is on its way. Launching soon.</p>
          <p class="status"><span class="dot" aria-hidden="true"></span> Coming soon</p>
        </div>
      </main>
      <footer>
        <span class="meta">BeautyMaxx</span>
        <span class="meta">All rights reserved</span>
      </footer>
    </div>
  </body>
</html>
